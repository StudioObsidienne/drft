<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="DRFT is an endless drum and bass radio in your browser: live DnB stations, your own WAVs or generated tracks, with pixel-art night racing visuals and shifting weather moods.">
<meta name="theme-color" content="#05030f">
<title>DRFT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500&family=Silkscreen&display=swap" rel="stylesheet">
<style>
/* Layout : le visuel tramé occupe tout l'écran. En bas à gauche le titre, en bas à droite quatre commandes,
   une barre de progression en blocs. Tout le reste vit dans un panneau à trois onglets.
   Les couleurs de l'interface suivent l'ambiance météo en cours. */
:root{
  --bg:#05030f; --bg-rgb:5,3,15;
  --ink:#7fe8dc; --ink-rgb:127,232,220;
  --font-px:"Silkscreen","Courier New",monospace;
  --font-txt:"Pixelify Sans","Courier New",monospace;
  color-scheme:dark;
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink)}
body{font-family:var(--font-txt);font-size:14px;touch-action:manipulation}
[hidden]{display:none!important}
#view{position:fixed;left:0;top:0;z-index:0;display:block;image-rendering:crisp-edges;image-rendering:pixelated}
#ui{position:fixed;inset:0;z-index:2;pointer-events:none}
#ui .live{pointer-events:auto}
button{font:inherit;color:inherit;border-radius:0}
button:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

.ib{width:40px;height:40px;display:grid;place-items:center;background:transparent;border:0;color:var(--ink);cursor:pointer;padding:0;flex:none}
.ib svg{width:20px;height:20px;fill:currentColor;shape-rendering:crispEdges}
.ib:hover{background:rgba(var(--ink-rgb),.14)}
.ib.big{width:52px;height:52px;background:var(--ink);color:var(--bg)}
.ib.big svg{width:24px;height:24px}
.ib.big:hover{background:rgba(var(--ink-rgb),.8)}
.ib.sm{width:30px;height:30px}
.ib.sm svg{width:16px;height:16px}
#btnLike[aria-pressed="false"] svg{opacity:.35}

.btn{font-family:var(--font-px);font-size:11px;letter-spacing:.06em;padding:9px 12px;border:2px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer;line-height:1}
.btn:hover,.btn.fill{background:var(--ink);color:var(--bg)}
.btn.fill:hover{background:transparent;color:var(--ink)}
.btn.ghost{border-color:rgba(var(--ink-rgb),.35)}

/* coins */
.corner{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;
  padding-top:calc(12px + env(safe-area-inset-top,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
.logo{font-family:var(--font-px);font-size:13px;letter-spacing:.1em;display:flex;align-items:center;gap:9px}
.logo i{width:6px;height:6px;background:var(--ink);opacity:.4}
.on .logo i{opacity:1;animation:blink 1.2s step-end infinite}
@keyframes blink{50%{opacity:.15}}

/* barre du bas */
.hud{position:absolute;left:0;right:0;bottom:0;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:16px 24px;
  padding-top:64px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:linear-gradient(to top,rgba(var(--bg-rgb),.88) 0%,rgba(var(--bg-rgb),.55) 55%,rgba(var(--bg-rgb),0) 100%)}
.np{min-width:0;display:grid;gap:6px}
.np-tag{font-family:var(--font-px);font-size:10px;letter-spacing:.1em;opacity:.65;display:flex;gap:14px;white-space:nowrap;overflow:hidden;font-variant-numeric:tabular-nums}
.np-title{display:flex;align-items:center;gap:8px;min-width:0}
.np-title span{font-family:var(--font-px);font-size:clamp(18px,2.8vw,30px);line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.np-artist{font-size:16px;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{display:flex;align-items:center;gap:4px}
.vol{display:flex;align-items:flex-end;gap:2px;height:40px;padding:10px 12px 10px 6px;cursor:ew-resize;touch-action:none;user-select:none;-webkit-user-select:none}
.vol:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.vol i{display:block;width:5px;background:rgba(var(--ink-rgb),.22);pointer-events:none}
.vol i.on{background:var(--ink)}
.prog{grid-column:1/-1}
.blocks{display:grid;grid-template-columns:repeat(40,1fr);gap:3px;height:6px;cursor:pointer}
.blocks i{background:rgba(var(--ink-rgb),.18)}
.blocks i.on{background:var(--ink)}

/* panneau */
.panel{position:absolute;top:0;right:0;bottom:0;width:min(380px,100%);background:rgba(var(--bg-rgb),.96);border-left:2px solid var(--ink);display:flex;flex-direction:column;z-index:5;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs{display:flex;align-items:stretch;border-bottom:2px solid var(--ink);flex:none}
.tab{flex:1;font-family:var(--font-px);font-size:11px;letter-spacing:.06em;padding:15px 4px;background:none;border:0;color:var(--ink);cursor:pointer}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.tabs .ib{height:auto;width:48px}
.pane{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:18px 18px 28px;display:grid;gap:22px;align-content:start}
.lbl{font-family:var(--font-px);font-size:10px;letter-spacing:.12em;opacity:.55}
.lbl-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.rows{display:grid;gap:2px}
.rows .lbl{margin:12px 0 4px}
.row-btn{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px;background:none;border:0;color:var(--ink);font-family:var(--font-px);font-size:12px;cursor:pointer;text-align:left;width:100%}
.row-btn:hover{background:rgba(var(--ink-rgb),.1)}
.row-btn[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.row-btn small{font-size:10px;opacity:.65}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{font-family:var(--font-px);font-size:10px;padding:7px 9px;border:2px solid rgba(var(--ink-rgb),.3);background:none;color:var(--ink);cursor:pointer;line-height:1}
.seg button:hover{border-color:var(--ink)}
.seg button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.tile{display:grid;gap:7px;padding:9px 8px;border:2px solid rgba(var(--ink-rgb),.22);background:none;color:var(--ink);font-family:var(--font-px);font-size:9px;letter-spacing:.04em;cursor:pointer;text-align:left;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tile:hover{border-color:rgba(var(--ink-rgb),.6)}
.tile[aria-pressed="true"]{border-color:var(--ink);background:rgba(var(--ink-rgb),.12)}
.tile .sw{display:grid;grid-template-columns:repeat(4,1fr);height:16px}
.set{display:grid;grid-template-columns:92px minmax(0,1fr);gap:12px;align-items:center}
details{border-top:2px solid rgba(var(--ink-rgb),.15)}
summary{font-family:var(--font-px);font-size:11px;letter-spacing:.06em;cursor:pointer;list-style:none;padding:14px 0;display:flex;justify-content:space-between;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-size:14px}
details[open] summary::after{content:"-"}
summary small{font-size:10px;opacity:.6;margin-left:auto;margin-right:12px}
details > :not(summary){margin-bottom:14px}
.list{display:grid;gap:2px;max-height:260px;overflow-y:auto}
.li{display:flex;align-items:center;gap:2px}
.li-btn{flex:1;min-width:0;text-align:left;background:none;border:0;color:var(--ink);padding:7px 8px;cursor:pointer}
.li-btn:hover{background:rgba(var(--ink-rgb),.1)}
.li-btn b{display:block;font-weight:500;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li-btn small{display:block;font-size:12px;opacity:.6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini{font-size:13px;opacity:.6;margin:0}
.refs{display:grid;gap:16px}
details .mini{margin-bottom:16px}
.ref-g h4{margin:0 0 4px;font-family:var(--font-px);font-size:9px;font-weight:400;letter-spacing:.08em;opacity:.55}
.ref{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:5px 0;font-size:13px}
.ref span{min-width:0}
.ref small{opacity:.55;margin-left:6px}
.ref nav{display:flex;gap:8px;flex:none}
.ref a{color:var(--ink);font-family:var(--font-px);font-size:9px;text-decoration:none;border-bottom:2px solid rgba(var(--ink-rgb),.35)}
.ref a:hover{border-color:var(--ink)}
.keys{font-family:var(--font-px);font-size:9px;letter-spacing:.06em;line-height:2;opacity:.5;margin:8px 0 0}

/* écran d'accueil, notifications */
.start{position:absolute;inset:0;display:grid;place-items:center;z-index:8;background:rgba(var(--bg-rgb),.35);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.start-card{display:grid;gap:18px;justify-items:center;text-align:center}
.start-logo{font-family:var(--font-px);font-size:clamp(30px,7vw,64px);line-height:1;letter-spacing:.04em;text-shadow:4px 4px 0 rgba(var(--bg-rgb),.9)}
.start-card .btn{font-size:13px;padding:13px 18px}
.toast{position:absolute;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);font-family:var(--font-px);font-size:10px;letter-spacing:.06em;line-height:1.5;padding:9px 12px;max-width:min(520px,calc(100% - 32px));z-index:9;text-align:center}
.toast[data-show="0"]{display:none}

/* masquage auto pendant l'écoute */
.fade{transition:opacity .45s steps(5)}
body.idle .fade{opacity:0;pointer-events:none}
body.idle .fade *{pointer-events:none}
body.idle{cursor:none}
body.boot .hud,body.boot .corner{visibility:hidden}

@media (max-width:640px){
  .hud{grid-template-columns:1fr;gap:12px}
  .ctl{justify-content:space-between}
  .vol{margin-right:auto}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (prefers-reduced-motion:reduce){.on .logo i{animation:none}.fade{transition:none}}
</style>
</head>
<body>
<canvas id="view" aria-hidden="true"></canvas>

<div id="ui">
  <header class="corner fade">
    <div class="logo live" id="logo"><i></i>DRFT</div>
    <button class="ib live" id="btnFull" aria-label="Fullscreen" title="Fullscreen (F)"><svg viewBox="0 0 16 16" data-i="full"></svg></button>
  </header>

  <footer class="hud fade">
    <div class="np live">
      <div class="np-tag"><span id="npStation">RETRO RACER</span><span id="npTime">0:00 / 0:00</span></div>
      <div class="np-title"><span id="npTitle">DRFT</span><button class="ib sm" id="btnLike" aria-label="Add to favorites" aria-pressed="false" title="Favorite (L)"><svg viewBox="0 0 16 16" data-i="heart"></svg></button></div>
      <div class="np-artist" id="npArtist">Drum &amp; bass radio</div>
    </div>
    <div class="ctl live">
      <div class="vol" id="vol" role="slider" tabindex="0" aria-label="Volume" aria-valuemin="0" aria-valuemax="100" aria-valuenow="80"></div>
      <button class="ib" id="btnPrev" aria-label="Previous track" title="Previous (←)"><svg viewBox="0 0 16 16" data-i="prev"></svg></button>
      <button class="ib big" id="btnPlay" aria-label="Play" title="Play / pause (Space)"><svg viewBox="0 0 16 16" id="icoPlay" data-i="play"></svg></button>
      <button class="ib" id="btnNext" aria-label="Next track" title="Next (N)"><svg viewBox="0 0 16 16" data-i="next"></svg></button>
      <button class="ib" id="btnMenu" aria-label="Menu" aria-expanded="false" aria-controls="panel" title="Menu (M)"><svg viewBox="0 0 16 16" data-i="menu"></svg></button>
    </div>
    <div class="prog live"><div class="blocks" id="blocks" aria-hidden="true"></div></div>
  </footer>

  <aside class="panel live" id="panel" hidden aria-label="Menu">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-music" data-tab="music" aria-selected="true">MUSIC</button>
      <button class="tab" role="tab" id="tab-visual" data-tab="visual" aria-selected="false">VISUALS</button>
      <button class="tab" role="tab" id="tab-settings" data-tab="settings" aria-selected="false">SETTINGS</button>
      <button class="ib" id="btnClose" aria-label="Close menu"><svg viewBox="0 0 16 16" data-i="close"></svg></button>
    </div>

    <div class="pane" data-pane="music" role="tabpanel" aria-labelledby="tab-music">
      <section><div class="rows" id="stations"></div></section>
      <div class="acts"><button class="btn" id="btnAddAudio">+ FILES</button><button class="btn" id="btnAddFolder">+ FOLDER</button></div>
      <div>
        <details id="dLib"><summary>MY LIBRARY<small id="audioCount">0</small></summary><div class="list" id="libList"></div><button class="btn ghost" id="btnClearAudio">REMOVE ALL</button></details>
        <details><summary>FAVORITES</summary><div class="list" id="favList"></div></details>
        <details><summary>HISTORY</summary><div class="list" id="histList"></div></details>
        <details><summary>DIGGING</summary><p class="mini">Real tracks worth buying in WAV. Not included.</p><div class="refs" id="refList"></div></details>
      </div>
    </div>

    <div class="pane" data-pane="visual" role="tabpanel" aria-labelledby="tab-visual" hidden>
      <section><div class="lbl-row"><span class="lbl">SCENE</span><div class="seg" id="cycleSeg"></div></div><div class="tiles" id="sceneTiles"></div></section>
      <section><div class="lbl-row"><span class="lbl">MOOD</span><div class="seg" id="themeCycleSeg"></div></div><div class="tiles" id="themeTiles"></div></section>
      <div class="acts"><button class="btn" id="btnAddImg">+ IMAGES</button><button class="btn ghost" id="btnClearImg">REMOVE</button><span class="mini" id="imgCount"></span></div>
    </div>

    <div class="pane" data-pane="settings" role="tabpanel" aria-labelledby="tab-settings" hidden>
      <div class="set"><span class="lbl">CROSSFADE</span><div class="seg" id="xfadeSeg"></div></div>
      <div class="set"><span class="lbl">SLEEP</span><div class="seg" id="sleepSeg"></div></div>
      <div class="set"><span class="lbl">PIXELS</span><div class="seg" id="pxSeg"></div></div>
      <div class="set"><span class="lbl">REACTION</span><div class="seg" id="reactSeg"></div></div>
      <div class="set"><span class="lbl">WEATHER</span><div class="seg" id="weatherSeg"></div></div>
      <p class="keys">SPACE PLAY · N NEXT · V SCENE · P MOOD · F FULLSCREEN · M MENU</p>
    </div>
  </aside>

  <div class="start live" id="start">
    <div class="start-card">
      <div class="start-logo">DRFT</div>
      <p class="mini">Endless drum &amp; bass for night drives.</p>
      <div class="acts"><button class="btn fill" id="btnStart">▶ LISTEN</button><button class="btn" id="btnStartImport">+ MY WAVS</button></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" data-show="0"></div>
  <input type="file" id="fileAudio" accept="audio/*,.wav,.wave,.aif,.aiff,.flac,.mp3,.ogg,.oga,.m4a,.aac,.opus,.webm" multiple hidden>
  <input type="file" id="fileFolder" webkitdirectory multiple hidden>
  <input type="file" id="fileImg" accept="image/*" multiple hidden>
</div>

<script>
(() => {
'use strict';

/* =====================================================================
   OUTILS
   ===================================================================== */
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const fract = x => x - Math.floor(x);
const smooth = x => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function ih(n) { n = (n << 13) ^ n; n = (Math.imul(n, (Math.imul(Math.imul(n, n), 15731) + 789221) | 0) + 1376312589) & 0x7fffffff; return n / 2147483647; }
function h1(n) { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
const REDUCED = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
const store = {
  get(k, d) { try { const v = localStorage.getItem('slipstream:' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('slipstream:' + k, JSON.stringify(v)); } catch (e) { /* stockage indisponible */ } }
};
const fmtTime = s => { s = Math.max(0, s || 0); const m = Math.floor(s / 60), r = Math.floor(s % 60); return m + ':' + String(r).padStart(2, '0'); };
const pickR = (r, a) => a[Math.floor(r() * a.length)];
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

/* =====================================================================
   AUDIO : KIT (bus master, réverb, delay, analyseur)
   ===================================================================== */
function mkGain(c, v) { const g = c.createGain(); g.gain.value = v; return g; }
function mkFilt(c, type, f, q) { const b = c.createBiquadFilter(); b.type = type; b.frequency.value = f; if (q != null) b.Q.value = q; return b; }
function mkPan(c, v) { if (c.createStereoPanner) { const p = c.createStereoPanner(); p.pan.value = clamp(v, -1, 1); return p; } return mkGain(c, 1); }

function makeImpulse(c, seconds, decay) {
  const len = Math.floor(c.sampleRate * seconds), buf = c.createBuffer(2, len, c.sampleRate);
  for (let ch = 0; ch < 2; ch++) {
    const d = buf.getChannelData(ch);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
  }
  return buf;
}

function makeKit(c) {
  const k = { ctx: c };
  const sr = c.sampleRate;
  const nb = c.createBuffer(1, sr * 2, sr), nd = nb.getChannelData(0);
  for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
  k.noise = nb;
  const cb = c.createBuffer(1, sr * 4, sr), cd = cb.getChannelData(0);
  for (let i = 0; i < cd.length; i++) cd[i] = Math.random() < 0.00035 ? (Math.random() * 2 - 1) * 0.9 : (Math.random() * 2 - 1) * 0.003;
  k.crackle = cb;
  const n = 40, re = new Float32Array(n), im = new Float32Array(n);
  for (let i = 1; i < n; i++) re[i] = 2 / (i * Math.PI) * Math.sin(i * Math.PI * 0.25);
  k.pulse = c.createPeriodicWave(re, im);
  const curve = new Float32Array(1024);
  for (let i = 0; i < 1024; i++) { const x = i / 511.5 - 1; curve[i] = Math.tanh(x * 2.2); }
  k.curve = curve;

  // chaîne master : input -> compresseur -> limiteur -> post -> analyseur -> volume -> minuteur -> sortie
  k.input = mkGain(c, 0.9);
  const comp = c.createDynamicsCompressor();
  comp.threshold.value = -18; comp.knee.value = 8; comp.ratio.value = 3.5; comp.attack.value = 0.008; comp.release.value = 0.18;
  const lim = c.createDynamicsCompressor();
  lim.threshold.value = -3; lim.knee.value = 0; lim.ratio.value = 20; lim.attack.value = 0.002; lim.release.value = 0.08;
  k.post = mkGain(c, 1);
  k.analyser = c.createAnalyser(); k.analyser.fftSize = 2048; k.analyser.smoothingTimeConstant = 0.5;
  k.analyser.minDecibels = -90; k.analyser.maxDecibels = -18;
  k.vol = mkGain(c, 0.64);
  k.sleep = mkGain(c, 1);
  k.input.connect(comp); comp.connect(lim); lim.connect(k.post); k.post.connect(k.analyser);
  k.analyser.connect(k.vol); k.vol.connect(k.sleep);
  // sortie : chemin direct + écho de pause (délai qui se répète en s'assombrissant)
  k.dry = mkGain(c, 1); k.sleep.connect(k.dry); k.dry.connect(c.destination);
  k.echoSend = mkGain(c, 0); k.echoDelay = c.createDelay(1.5); k.echoDelay.delayTime.value = 0.32;
  k.echoLP = mkFilt(c, 'lowpass', 5000, 0.4); k.echoHP = mkFilt(c, 'highpass', 90, 0.5);
  k.echoFb = mkGain(c, 0.6); k.echoOut = mkGain(c, 0);
  const ev = c.createConvolver(); ev.buffer = makeImpulse(c, 3.2, 2.4); const evIn = mkGain(c, 0.55);
  k.sleep.connect(k.echoSend); k.echoSend.connect(k.echoDelay);
  k.echoDelay.connect(k.echoLP); k.echoLP.connect(k.echoHP); k.echoHP.connect(k.echoFb); k.echoFb.connect(k.echoDelay);
  k.echoHP.connect(k.echoOut); k.echoHP.connect(evIn); evIn.connect(ev); ev.connect(k.echoOut); k.echoOut.connect(c.destination);

  // réverb
  k.revIn = mkGain(c, 1);
  const rhp = mkFilt(c, 'highpass', 260, 0.7), conv = c.createConvolver();
  conv.buffer = makeImpulse(c, 2.8, 2.6);
  const rout = mkGain(c, 0.55);

  ride(k, ch, t, v = 0.2) {

  pad(k, ch, t, notes, dur, v = 0.1, bright = 1, att = 0.4) {

  neuro: [['TORQUE', 'CARBON', 'TITANIUM', 'HYDRAULIC', 'KINETIC', 'FRACTURE', 'PISTON', 'BOOST', 'INTAKE', 'MANIFOLD'], ['PRESSURE', 'CORE', 'FAULT', 'LOOP', 'SYSTEM', 'MATRIX', 'UNIT', 'SPLINE', 'SECTOR', 'LIMITER']],
  atmos: [['ORBITAL', 'POLAR', 'HIGH', 'NIGHT', 'DEEP', 'THIN', 'CLOUD', 'STRATO', 'LUNAR', 'QUIET'], ['AIR', 'FIELDS', 'DRIFT', 'PASSAGE', 'SKIES', 'STATE', 'GLOW', 'ECHO', 'TIDE', 'LINE']]
};
const A1 = ['Sub', 'Low', 'Aero', 'Kilo', 'Nova', 'Halo', 'Vex', 'Orbit', 'Delta', 'Mono', 'Opti', 'Strata', 'Tensor', 'Kerb', 'Silt', 'Ion', 'Quartz', 'Vanta', 'Rift', 'Apex'];
const A2 = ['form', 'phase', 'tek', 'unit', 'line', 'wave', 'noise', 'grid', 'state', 'scope', 'circuit', 'system', 'motion', 'drift'];

function degNote(tr, d) { const o = Math.floor(d / 7), i = ((d % 7) + 7) % 7; return tr.root + 12 * o + tr.scale[i]; }
function chordAt(tr, bar) { return tr.prog[Math.floor(bar / tr.chordBars) % tr.prog.length]; }
function chordNotes(tr, deg, n = 3, base = 21) { const out = []; for (let i = 0; i < n; i++) out.push(degNote(tr, deg + base + i * 2)); return out; }
function bassRootOf(tr, deg) { let m = degNote(tr, deg); while (m > 40) m -= 12; while (m < 28) m += 12; return m; }

function buildSections(st, r) {
  const L = [];
  const add = (name, bars, o) => L.push(Object.assign({ name, bars, drums: 'none', bass: 0, pads: 0, lead: 0, arp: 0, keys: 0, stab: 0 }, o));
  const melodic = st === 'retro' || st === 'liquid' || st === 'atmos';
  add('Intro', (st === 'atmos' || r() < 0.5) ? 16 : 8, { drums: 'hats', pads: 1, arp: st === 'retro' ? 1 : 0, keys: st === 'liquid' ? 1 : 0, filter: [450, 5000], fadeIn: 1 });
  add('Build', 8, { drums: 'build', bass: 'sub', pads: 1, arp: st === 'retro' ? 1 : 0, keys: st === 'liquid' ? 1 : 0, riser: 1, filter: [1800, 20000] });
  add('Drop', r() < 0.4 ? 16 : 32, { drums: 'full', bass: 1, pads: st === 'neuro' ? 0 : 0.6, lead: (st === 'retro' || st === 'liquid') ? 1 : 0, arp: st === 'retro' ? 0.6 : 0, keys: st === 'liquid' ? 1 : 0, stab: st === 'jungle' ? 1 : 0, impact: 1 });
  add('Break', r() < 0.5 ? 8 : 16, { drums: (st === 'neuro' || st === 'jungle') ? 'half' : st === 'atmos' ? 'none' : 'hats', bass: st === 'jungle' ? 1 : 0, pads: 1, lead: melodic ? 1 : 0, arp: st === 'liquid' ? 0.8 : st === 'retro' ? 1 : 0, keys: st === 'liquid' ? 1 : 0, down: 1 });
  add('Build', 8, { drums: 'build', bass: 'sub', pads: 1, arp: st === 'retro' ? 1 : 0, riser: 1, filter: [1800, 20000] });
  add('Drop II', 32, { drums: 'full2', bass: 2, pads: st === 'neuro' ? 0.3 : 0.7, lead: melodic ? 1 : 0, arp: st === 'retro' ? 1 : st === 'liquid' ? 0.5 : 0, keys: st === 'liquid' ? 1 : 0, stab: st === 'jungle' ? 1 : 0, impact: 1 });
  add('Outro', r() < 0.5 ? 8 : 16, { drums: 'full', pads: 1, arp: st === 'retro' ? 0.6 : 0, keys: st === 'liquid' ? 1 : 0, fadeOut: 1, filter: [20000, 1200] });
  let b = 0; for (const s of L) { s.start = b; b += s.bars; }
  return L;
}

function genMelody(tr, r, st) {
  const bars = tr.prog.length * tr.chordBars, ev = new Map();
  const R = {
    retro: [[0, 3, 6, 8, 10, 12, 14], [0, 2, 3, 6, 8, 11, 14], [0, 3, 6, 10, 12, 14], [0, 4, 6, 8, 11, 12, 14]],
    liquid: [[0, 6, 10], [0, 3, 8, 10, 14], [2, 6, 10, 12], [0, 8, 10]],
    atmos: [[0], [0, 8], [0, 10]]
  }[st] || [[0, 8]];
  const rA = pickR(r, R), rB = pickR(r, R);
  const base = st === 'atmos' ? 21 : 28;
  let d = base + tr.prog[0] + 2 * Math.floor(r() * 3);
  for (let b = 0; b < bars; b++) {
    const deg = chordAt(tr, b), rh = (b % 2 === 0) ? rA : rB, arr = [];
    for (let i = 0; i < rh.length; i++) {
      const pos = rh[i], next = i + 1 < rh.length ? rh[i + 1] : 16;
      if (pos === 0 || pos === 8) {
        const tones = [deg + base, deg + base + 2, deg + base + 4, deg + base + 7];
        d = tones.reduce((a, x) => Math.abs(x - d) < Math.abs(a - d) ? x : a, tones[0]);
      } else d += pickR(r, [-2, -1, -1, 1, 1, 2]);
      d = clamp(d, base - 1, base + 9);
      arr.push({ pos, dur: Math.min(st === 'atmos' ? 14 : 6, next - pos), m: degNote(tr, d) });
    }
    ev.set(b, arr);
  }
  return { bars, ev };
}

function maskToRhythm(mask) {
  const on = []; for (let i = 0; i < 16; i++) if (mask[i] === 'x') on.push(i);
  const dur = on.map((p, i) => (i + 1 < on.length ? on[i + 1] : 16) - p);
  return { on, dur };
}

function makeTrack(st, seed) {
  const S = STYLES[st], r = mulberry32(seed >>> 0);
  const tr = { kind: 'gen', style: st, seed: seed >>> 0 };
  tr.bpm = Math.round(S.bpm[0] + r() * (S.bpm[1] - S.bpm[0]));
  tr.key = pickR(r, S.keys);
  tr.root = 24 + tr.key;
  tr.scale = SCALES[S.scale];
  tr.prog = pickR(r, S.progs);
  tr.chordBars = S.chordBars;
  tr.swing = S.swing;
  tr.sections = buildSections(st, r);
  tr.totalBars = tr.sections.reduce((a, s) => a + s.bars, 0);
  tr.keyName = NOTE_NAMES[tr.key] + (S.scale === 'dorian' ? ' dorian' : ' min');
  const W = WORDS[st];
  let title = pickR(r, W[0]) + ' ' + pickR(r, W[1]);
  const v = r(); if (v < 0.1) title += ' VIP'; else if (v < 0.16 && st === 'jungle') title += ' (DUB)';
  tr.title = title;
  tr.artist = r() < 0.7 ? pickR(r, A1) + pickR(r, A2) : pickR(r, A1) + ' ' + pickR(r, A1).toLowerCase().replace(/^./, c => c.toUpperCase());
  if (r() < 0.15) tr.artist += ' & ' + pickR(r, A1) + pickR(r, A2);
  tr.id = st + '-' + tr.seed;
  // lignes de basse et motifs
  const RETRO = [{ 0: 0, 3: 12, 6: 0, 8: 7, 11: 12, 14: 0 }, { 0: 12, 3: 0, 6: 12, 10: 7, 12: 12, 14: 10 }, { 0: 0, 2: 12, 6: 0, 8: 12, 11: 7, 14: 12 }, { 0: 0, 3: 0, 6: 12, 8: 0, 11: 10, 14: 12 }];
  tr.retroA = pickR(r, RETRO); tr.retroB = pickR(r, RETRO);
  tr.liqLine = pickR(r, [[{ p: 0, d: 6, n: 0 }, { p: 6, d: 4, n: 0 }, { p: 10, d: 6, n: 7 }], [{ p: 0, d: 10, n: 0 }, { p: 10, d: 3, n: 12 }, { p: 13, d: 3, n: 7 }], [{ p: 0, d: 14, n: 0 }, { p: 14, d: 2, n: -2 }]]);
  tr.jungLine = pickR(r, [[{ p: 0, d: 10, n: 0 }, { p: 10, d: 6, n: 0, to: -5 }], [{ p: 0, d: 6, n: 0 }, { p: 6, d: 4, n: 7 }, { p: 10, d: 6, n: 0, to: -7 }], [{ p: 0, d: 16, n: 0, to: -12 }]]);
  const nm = maskToRhythm(pickR(r, ['x..x..x.x.x.....', 'x.....x...x.x...', 'x..x....x..x..x.', 'x...x.x...x..x..']));
  const notes = []; for (let i = 0; i < 32; i++) notes.push(pickR(r, [0, 0, 0, 12, 1, -2, 7, 3]));
  tr.neuro = { on: nm.on, dur: nm.dur, notes };
  tr.arpSeq = pickR(r, [[0, 1, 2, 1], [0, 1, 2, 3], [0, 2, 1, 2], [0, 1, 2, 3, 2, 1]]);
  tr.keyPat = pickR(r, [[0, 6, 10], [0, 3, 10], [0, 10], [2, 6, 12]]);
  tr.melody = (st === 'retro' || st === 'liquid' || st === 'atmos') ? genMelody(tr, r, st) : null;
  tr.duration = tr.totalBars * 16 * (60 / tr.bpm / 4);
  return tr;
}

const PAT = {
  two:   { k: { 0: 1, 10: 0.9 }, s: { 4: 1, 12: 1 }, g: { 7: 0.22, 9: 0.16, 14: 0.24, 15: 0.14 } },
  retro: { k: { 0: 1, 6: 0.8, 10: 0.9 }, s: { 4: 1, 12: 1 }, g: { 9: 0.15, 15: 0.2 } },
  jA:    { k: { 0: 1, 2: 0.75, 10: 0.9, 11: 0.55 }, s: { 4: 1, 12: 1 }, g: { 7: 0.35, 9: 0.45, 15: 0.3 } },
  jB:    { k: { 0: 1, 2: 0.7, 10: 0.85 }, s: { 4: 1, 12: 0.95 }, g: { 6: 0.3, 7: 0.35, 9: 0.4, 14: 0.5 } }
};

/* chaîne propre à chaque morceau (permet de couper net en changeant de titre) */
function makeChain(k) {
  const c = k.ctx, ch = {};
  ch.out = c.createGain();
  ch.filter = mkFilt(c, 'lowpass', 20000, 0.7);
  ch.drums = mkGain(c, 0.85); ch.bass = mkGain(c, 0.8); ch.music = mkGain(c, 0.7);
  const bhp = mkFilt(c, 'highpass', 25, 0.7);
  ch.bass.connect(bhp); bhp.connect(ch.filter); ch.drums.connect(ch.filter); ch.music.connect(ch.filter);
  ch.filter.connect(ch.out); ch.out.connect(k.input);
  ch.rev = mkGain(c, 1); ch.rev.connect(k.revIn);
  ch.dly = mkGain(c, 1); ch.dly.connect(k.dlyIn);
  ch.kill = t => {
    for (const g of [ch.out, ch.rev, ch.dly]) {
      const p = g.gain;
      if (p.cancelAndHoldAtTime) p.cancelAndHoldAtTime(t); else { p.cancelScheduledValues(t); p.setValueAtTime(p.value, t); }
      p.linearRampToValueAtTime(0, t + 0.2);
    }
  };
  ch.dispose = () => { for (const n of [ch.out, ch.rev, ch.dly]) { try { n.disconnect(); } catch (e) { /* déjà déconnecté */ } } };
  return ch;
}

class GenPlayer {
  constructor(kit, tr, when, startStep = 0) {
    this.kind = 'gen'; this.kit = kit; this.tr = tr;
    this.sd = 60 / tr.bpm / 4;
    this.total = tr.totalBars * 16;
    this.step = clamp(startStep, 0, this.total);
    this.t0 = when - this.step * this.sd;
    this.startTime = when;
    this.endTime = this.t0 + this.total * this.sd;
    this.dur = this.endTime - this.t0;
    this.next = this.t0 + this.step * this.sd;
    this.done = false; this.killed = false;
    this.r = mulberry32((tr.seed ^ 0x5bd1e995) >>> 0);
    this.lastPluck = null; this.lastLead = null;
    this.secOf = [];
    for (const s of tr.sections) for (let i = 0; i < s.bars; i++) this.secOf.push(s);
    this.ch = makeChain(kit);
    kit.delay.delayTime.setValueAtTime(this.sd * 3, Math.max(when, kit.ctx.currentTime));
    this.automate();
  }
  automate() {
    const f = this.ch.filter.frequency, g = this.ch.out.gain, bl = this.sd * 16, st = this.startTime;
    g.setValueAtTime(1, st); f.setValueAtTime(20000, st);
    for (const s of this.tr.sections) {
      const ts = this.t0 + s.start * bl, te = ts + s.bars * bl;
      if (te <= st + 0.05) continue;
      const a = Math.max(ts, st);
      if (s.filter) {
        const p = (a - ts) / (te - ts), f0 = s.filter[0] * Math.pow(s.filter[1] / s.filter[0], p);
        f.setValueAtTime(f0, a); f.exponentialRampToValueAtTime(s.filter[1], te - 0.02);
      } else f.setValueAtTime(20000, a);
      if (s.fadeIn && ts >= st) { g.setValueAtTime(0.05, ts); g.linearRampToValueAtTime(1, ts + Math.min(4, s.bars) * bl); }
      if (s.fadeOut) { const fm = Math.max(a, ts + (s.bars / 2) * bl); g.setValueAtTime(1, fm); g.linearRampToValueAtTime(0.0001, te); }
    }
  }
  catchUp(now) {
    if (this.step < this.total && this.next < now - 0.06) {
      const s = Math.ceil((now - this.t0) / this.sd);
      this.step = Math.min(this.total, Math.max(this.step, s));
      this.next = this.t0 + this.step * this.sd;
    }
    if (this.step >= this.total) this.done = true;
  }
  scheduleUntil(h) {
    while (this.step < this.total && this.next < h) {
      try { this.playStep(this.step, this.next); } catch (e) { console.error('[slipstream] step', e); }
      this.step++; this.next = this.t0 + this.step * this.sd;
    }
    if (this.step >= this.total) this.done = true;
  }
  kill(now) { this.ch.kill(now); this.killed = true; this.done = true; this.step = this.total; this.endTime = Math.min(this.endTime, now + 0.25); }
  dispose() { this.ch.dispose(); }
  posInfo(now) {
    const el = now - this.t0, bar = Math.floor(el / (this.sd * 16));
    const s = this.secOf[clamp(bar, 0, this.secOf.length - 1)];
    return { el, dur: this.dur, section: s ? s.name : '', beat: el / (this.sd * 4) };
  }
  playStep(step, t) {
    const tr = this.tr, k = this.kit, ch = this.ch, sd = this.sd;
    const bar = step >> 4, pos = step & 15, sec = this.secOf[bar], bIn = bar - sec.start, left = sec.bars - bIn, st = tr.style;
    const tt = (pos & 1) ? t + tr.swing * sd : t;
    const deg = chordAt(tr, bar), br = bassRootOf(tr, deg), chordStart = (bar % tr.chordBars === 0) && pos === 0;
    if (bIn === 0 && pos === 0) {
      if (sec.riser) I.riser(k, ch, t, sec.bars * 16 * sd, 0.14);
      if (sec.impact) { I.impact(k, ch, t, 0.55); I.hat(k, ch, t, 0.5, true); }
      if (sec.down) I.down(k, ch, t, Math.min(sec.bars, 4) * 16 * sd, 0.1);
    }
    if (step === 0 && (st === 'jungle' || st === 'atmos')) I.crackle(k, ch, t, this.dur, st === 'jungle' ? 0.5 : 0.35);
    this.drums(sec, bIn, left, bar, pos, t, tt);
    this.bass(sec, bIn, left, bar, pos, t, tt, deg, br);
    this.music(sec, bar, pos, t, tt, deg, chordStart);
  }
  drums(sec, bIn, left, bar, pos, t, tt) {
    const k = this.kit, ch = this.ch, r = this.r, st = this.tr.style, m = sec.drums;
    if (m === 'none') { if (st === 'atmos' && pos % 4 === 2) I.hat(k, ch, tt, 0.06); return; }
    const hats = lvl => {
      if (st === 'liquid' || st === 'atmos') I.hat(k, ch, tt, (pos % 4 === 2 ? 0.32 : pos % 2 === 0 ? 0.2 : 0.1) * lvl * (st === 'atmos' ? 0.7 : 1));
      else if (st === 'jungle') { if (pos % 2 === 0) I.ride(k, ch, tt, 0.12 * lvl); if (pos % 4 === 2) I.hat(k, ch, tt, 0.22 * lvl); }
      else if (st === 'neuro') { if (pos % 2 === 0) I.hat(k, ch, tt, (pos % 4 === 2 ? 0.3 : 0.18) * lvl); else if (m === 'full2') I.hat(k, ch, tt, 0.09 * lvl); }
      else if (pos % 2 === 0) I.hat(k, ch, tt, (pos % 4 === 2 ? 0.3 : 0.16) * lvl, pos === 14 && bar % 2 === 1);
    };
    if (m === 'hats') { hats(0.7); if (left <= 2 && pos === 0) I.kick(k, ch, t, 0.6); return; }
    if (m === 'build') {
      hats(0.8);
      if (left <= 4) { if (pos % 4 === 0) I.kick(k, ch, t, 0.8); }
      else if (pos === 0 || pos === 10) I.kick(k, ch, t, 0.7);
      if (left === 1) I.snare(k, ch, t, 0.15 + 0.6 * pos / 15, 0.6);
      else if (left === 2) { if (pos % 2 === 0) I.snare(k, ch, t, 0.35, 0.7); }
      else if (pos === 4 || pos === 12) I.snare(k, ch, t, 0.6);
      return;
    }
    if (m === 'half') { hats(0.6); if (pos === 0 || (pos === 10 && r() < 0.5)) I.kick(k, ch, t, 0.9); if (pos === 8) I.snare(k, ch, t, 0.95, 1.2); return; }
    const two = m === 'full2';
    const P = st === 'jungle' ? (bar % 2 === 0 ? PAT.jA : PAT.jB) : st === 'retro' ? PAT.retro : PAT.two;
    if (P.k[pos] != null) I.kick(k, ch, t, P.k[pos], st === 'neuro' ? 0.95 : 1);
    if (P.s[pos] != null) I.snare(k, ch, t, P.s[pos] * (st === 'atmos' ? 0.8 : 1), 1, st === 'jungle' ? 0.92 + r() * 0.16 : 1);
    const gp = P.g[pos];
    if (gp != null && r() < (two ? 0.85 : 0.5)) I.snare(k, ch, tt, gp, 0.55, st === 'jungle' ? 0.9 + r() * 0.2 : 1.05);
    if (st === 'jungle' && r() < 0.06 && P.k[pos] == null && P.s[pos] == null) I.snare(k, ch, tt, 0.3, 0.5, 1.1);
    if (bIn % 8 === 7 && pos >= 12 && r() < 0.6) I.snare(k, ch, tt, 0.3 + 0.1 * (pos - 12), 0.6, 1.05);
    hats(two ? 1 : 0.85);
    if (two && st === 'liquid' && pos % 4 === 0) I.ride(k, ch, tt, 0.08);
  }
  bass(sec, bIn, left, bar, pos, t, tt, deg, br) {
    const k = this.kit, ch = this.ch, tr = this.tr, sd = this.sd, st = tr.style, b = sec.bass;
    if (!b) return;
    if (b === 'sub') { if (pos === 0 && left <= 4) I.sub(k, ch, t, br, 16 * sd * 0.95, 0.45); return; }
    const v2 = b === 2;
    switch (st) {
      case 'retro': {
        if (pos === 0) I.sub(k, ch, t, br, 16 * sd * 0.97, 0.5);
        const iv = (v2 ? tr.retroB : tr.retroA)[pos];
        if (iv != null) { const m = br + 12 + iv; I.pluck(k, ch, tt, m, sd * 2.4, 0.3, this.lastPluck, v2 ? 1.4 : 1); this.lastPluck = m; }
        break;
      }
      case 'liquid':
        for (const e of tr.liqLine) if (e.p === pos) I.sub(k, ch, tt, br + e.n, e.d * sd * 0.95, 0.62);
        break;
      case 'jungle':
        for (const e of tr.jungLine) if (e.p === pos) I.sub(k, ch, tt, br + e.n, e.d * sd * 0.97, 0.7, null, (e.to != null && bar % 4 === 3) ? br + e.to : null);
        break;
      case 'neuro': {
        const idx = tr.neuro.on.indexOf(pos);
        if (idx >= 0) {
          const d = tr.neuro.dur[idx], n = tr.neuro.notes[(bar % 4) * 8 + (idx % 8)];
          const lfo = [2, 4, 8, 3][(bar + idx) % 4] * (tr.bpm / 60) / 2;
          I.reese(k, ch, tt, br + n, d * sd * 0.92, v2 ? 0.48 : 0.42, { lfo, depth: 900, cut: 1100, drive: v2 ? 2.6 : 1.8 });
          I.sub(k, ch, tt, br + n, d * sd * 0.9, 0.42);
        }
        break;
      }
      case 'atmos':
        if (pos === 0 && bar % 2 === 0) { I.sub(k, ch, t, br, 32 * sd * 0.97, 0.5); I.reese(k, ch, t, br + 12, 32 * sd * 0.95, 0.2, { cut: 500, lfo: 0.25, depth: 300, drive: 1 }); }
        break;
    }
  }
  music(sec, bar, pos, t, tt, deg, chordStart) {
    const k = this.kit, ch = this.ch, tr = this.tr, sd = this.sd, st = tr.style, r = this.r;
    if (sec.pads > 0 && chordStart) {
      const n = (st === 'liquid' || st === 'atmos') ? 4 : 3;
      const v = (st === 'neuro' ? 0.06 : st === 'retro' ? 0.09 : 0.11) * sec.pads;
      I.pad(k, ch, t, chordNotes(tr, deg, n), tr.chordBars * 16 * sd, v, st === 'retro' ? 1.4 : st === 'neuro' ? 0.6 : 1, st === 'atmos' ? 1.5 : 0.4);
    }
    if (st === 'atmos' && (sec.name === 'Intro' || sec.name === 'Break') && pos === 0 && bar % 4 === 0) I.drone(k, ch, t, degNote(tr, deg + 14), 64 * sd, 0.07);
    if (sec.keys && st === 'liquid' && tr.keyPat.includes(pos)) I.keys(k, ch, tt, chordNotes(tr, deg, 4, 14), 0.11, 1.6);
    if (sec.lead && tr.melody) {
      const evs = tr.melody.ev.get(bar % tr.melody.bars);
      if (evs) for (const e of evs) if (e.pos === pos) {
        const type = st === 'retro' ? 'pulse' : st === 'liquid' ? 'triangle' : 'sine';
        const from = (st === 'retro' && this.lastLead != null && r() < 0.3) ? this.lastLead : null;
        I.lead(k, ch, tt, e.m, e.dur * sd * 0.9, st === 'retro' ? 0.075 : 0.09, type, from);
        this.lastLead = e.m;
      }
    }
    if (sec.arp && (st === 'retro' || st === 'liquid')) {

   ===================================================================== */
const F = { bass: 0, mid: 0, high: 0, energy: 0, pulse: 0 };
let fbuf = null, lastKick = 0, bassAvg = 0;
function updateFeatures(dt, now) {
  const k = Radio.kit;
  const air = Radio.cur;
  const simulate = air && air.kind === 'live' && (air.plain || air.state !== 'playing');
  if (k && Radio.playing && simulate) {
    const beat = fract((now / 1000) * (174 / 60));
    F.bass = lerp(F.bass, 0.3 + 0.35 * Math.exp(-beat * 5), 0.3);
    F.high = lerp(F.high, 0.3 + 0.15 * Math.sin(now * 0.011), 0.3);
    F.mid = lerp(F.mid, 0.3, 0.2);
    if (beat < 0.08 && now - lastKick > 250 && ((now / 1000 * 174 / 60) | 0) % 2 === 0) { F.pulse = 1; lastKick = now; }
  } else if (k && Radio.playing) {
    if (!fbuf || fbuf.length !== k.analyser.frequencyBinCount) fbuf = new Uint8Array(k.analyser.frequencyBinCount);
    k.analyser.getByteFrequencyData(fbuf);
    const hz = k.ctx.sampleRate / k.analyser.fftSize;
    const band = (a, b) => { let s = 0, n = 0; for (let i = Math.max(1, Math.floor(a / hz)); i <= Math.min(fbuf.length - 1, Math.ceil(b / hz)); i++) { s += fbuf[i]; n++; } return n ? s / (n * 255) : 0; };

    F.bass = lerp(F.bass, b, b > F.bass ? 0.6 : 0.15);
    F.mid = lerp(F.mid, m, 0.3);
    F.high = lerp(F.high, h, h > F.high ? 0.6 : 0.2);
    bassAvg = lerp(bassAvg, b, 0.05);
    if (b - bassAvg > 0.06 && b > 0.3 && now - lastKick > 170) { F.pulse = 1; lastKick = now; }
  } else {
    const beat = fract((now / 1000) * (85 / 60));
    F.bass = lerp(F.bass, 0.18 + 0.18 * Math.exp(-beat * 6), 0.2);
    F.high = lerp(F.high, 0.15 + 0.08 * Math.sin(now * 0.003), 0.2);
    F.mid = lerp(F.mid, 0.15, 0.2);
    if (beat < 0.06 && now - lastKick > 400) { F.pulse = 0.5; lastKick = now; }
  }
  F.pulse *= Math.exp(-dt * 5.5);
  F.energy = lerp(F.energy, F.bass * 0.5 + F.mid * 0.3 + F.high * 0.4, 0.05);
}

let sceneIdx = clamp(settings.scene | 0, 0, SCENES.length - 1);

function goScene(idx) {
  idx = ((idx % SCENES.length) + SCENES.length) % SCENES.length;
  if (trans) { sceneIdx = trans.to; trans = null; }
  if (idx === sceneIdx) return;
  trans = { to: idx, t0: performance.now(), dur: REDUCED ? 500 : 1400 };
  settings.scene = idx; saveSettings(); sceneTimer = 0;
  UI.renderScenes();
}
function nextScene(dir = 1) {

  let i = base;
  for (let n = 0; n < SCENES.length; n++) { i = (i + dir + SCENES.length) % SCENES.length; if (SCENES[i] !== SceneImages || IMGS.length) break; }
  goScene(i);
}

let costAvg = 8, slowFrames = 0;
function frame(now) {
  const dt = Math.min(0.1, Math.max(0, (now - lastFrame) / 1000)); lastFrame = now;
  const w0 = performance.now();
  try {
    updateFeatures(dt, now);
    const r = settings.react * (REDUCED ? 0.4 : 1);
    const FR = { bass: F.bass * r, mid: F.mid * r, high: F.high * r, energy: F.energy * r, pulse: F.pulse * r };
    updateTheme(dt, now);
    weatherUpdate(dt, FR);
    const cur = SCENES[sceneIdx];
    cur.draw(ctxA, now, dt, FR); weatherDraw(ctxA, cur, now);
    const a = ctxA.getImageData(0, 0, V.W, V.H).data;
    let b = a, wipe = -1;
    if (trans) {
      const p = (now - trans.t0) / trans.dur;
      if (p >= 1) { sceneIdx = trans.to; trans = null; }
      else { const nx = SCENES[trans.to]; nx.draw(ctxB, now, dt, FR); weatherDraw(ctxB, nx, now); b = ctxB.getImageData(0, 0, V.W, V.H).data; wipe = p; }
    }

    vctx.putImageData(OUT, 0, 0);
    sceneTimer += dt;
    if ((settings.cycle === '30' && sceneTimer > 30) || (settings.cycle === '60' && sceneTimer > 60)) nextScene();
    themeTimer += dt;
    if ((settings.themeCycle === '60' && themeTimer > 60) || (settings.themeCycle === '120' && themeTimer > 120)) nextTheme(true);
    UI.frame(now);
    // garde-fou anti-lag : si le rendu devient trop lourd, on grossit les pixels
    costAvg = lerp(costAvg, performance.now() - w0, 0.05);

}

const IDB = {
  db: null,
  open() {

        rq.onsuccess = () => { this.db = rq.result; res(this.db); };

  },
  all(store) {

    });
  },
  put(store, rec) {

        tx.oncomplete = () => res(true); tx.onerror = () => res(false); tx.onabort = () => res(false);
      } catch (e) { res(false); }

/* métadonnées : bloc INFO des WAV (INAM / IART), sinon nom de fichier « Artiste - Titre » */
async function readMeta(file) {
  let title = null, artist = null;
  try {
    if (/\.wave?$/i.test(file.name) || /wav/i.test(file.type || '')) {
      const ab = await file.slice(0, Math.min(file.size, 1 << 20)).arrayBuffer(), d = new DataView(ab), n = ab.byteLength;
      const str = (o, len) => { let s = ''; for (let i = 0; i < len; i++) s += String.fromCharCode(d.getUint8(o + i)); return s; };
      if (n > 12 && str(0, 4) === 'RIFF' && str(8, 4) === 'WAVE') {
        let o = 12;
        while (o + 8 <= n) {
          const id = str(o, 4), sz = d.getUint32(o + 4, true);
          if (id === 'LIST' && o + 12 <= n && str(o + 8, 4) === 'INFO') {
            let q = o + 12; const end = Math.min(o + 8 + sz, n);
            while (q + 8 <= end) {
              const sid = str(q, 4), ssz = d.getUint32(q + 4, true);
              if (q + 8 + ssz > end) break;
              const txt = new TextDecoder('utf-8').decode(new Uint8Array(ab, q + 8, ssz)).replace(/\0+$/, '').trim();
              if (sid === 'INAM' && txt) title = txt;
              if (sid === 'IART' && txt) artist = txt;
              q += 8 + ssz + (ssz & 1);
            }
          }
          if (id === 'data') break;
          o += 8 + sz + (sz & 1);
        }
      }
    }
  } catch (e) { /* métadonnées illisibles : on garde le nom de fichier */ }
  const base = file.name.replace(/\.[^.]+$/, '').replace(/_/g, ' ').trim();
  const m = base.match(/^\s*(?:\d{1,3}[\s.\-]+)?(.+?)\s+[-–—]\s+(.+)$/);
  const ok = m && !/^\d+$/.test(m[1].trim());
  return { title: title || (ok ? m[2] : (m && /^\d+$/.test(m[1].trim()) ? m[2] : base)), artist: artist || (ok ? m[1] : 'My library') };
}

let storageWarned = false;
async function addAudioFiles(list) {
  const fs = [...list].filter(f => AUDIO_EXT.test(f.name) || (f.type && f.type.startsWith('audio/')));
  if (!fs.length) { UI.toast('FORMAT NOT RECOGNIZED'); return; }
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { /* ok */ }
  let added = 0, skipped = 0;
  UI.toast('IMPORTING…');
  for (const f of fs) {
    if (Radio.files.some(x => x.name === f.name && x.size === f.size)) { skipped++; continue; }
    const meta = await readMeta(f);
    const item = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 8), name: f.name, size: f.size, title: meta.title, artist: meta.artist, added: Date.now(), blob: f };
    Radio.files.push(item); added++;
    IDB.put('tracks', item).then(ok => { if (!ok && !storageWarned) { storageWarned = true; UI.toast('STORAGE FULL: KEPT FOR THIS SESSION ONLY'); } });
  }
  Radio.fileQueue = [];
  updateCounts(); UI.renderStations(); UI.renderLibrary();
  UI.toast('+' + added + ' TRACK' + (added > 1 ? 'S' : '') + (skipped ? ' · ' + skipped + ' ALREADY THERE' : ''));

  }
}

function loadImg(blob) {
  return new Promise((res, rej) => {
    const u = URL.createObjectURL(blob), im = new Image();
    im.onload = () => { res(im); setTimeout(() => URL.revokeObjectURL(u), 1000); };
    im.onerror = () => { URL.revokeObjectURL(u); rej(new Error('image')); };
    im.src = u;
  });
}
async function blobToCanvas(blob, max) {
  const im = await loadImg(blob);
  const iw = im.naturalWidth || im.width, ihh = im.naturalHeight || im.height;
  if (!iw || !ihh) throw new Error('image vide');
  const s = Math.min(1, max / Math.max(iw, ihh)), c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(iw * s)); c.height = Math.max(1, Math.round(ihh * s));
  c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
  return c;
}
function processImage(src) {
  const w = src.width, h = src.height, x = src.getContext('2d', { willReadFrequently: true }), d = x.getImageData(0, 0, w, h), p = d.data;
  const hist = new Uint32Array(256), n = w * h;
  for (let i = 0; i < p.length; i += 4) hist[(p[i] * 77 + p[i + 1] * 150 + p[i + 2] * 29) >> 8]++;
  let acc = 0, lo = 0, hi = 255;
  for (let i = 0; i < 256; i++) { acc += hist[i]; if (acc > n * 0.02) { lo = i; break; } }
  acc = 0; for (let i = 255; i >= 0; i--) { acc += hist[i]; if (acc > n * 0.02) { hi = i; break; } }
  const span = Math.max(1, hi - lo);
  for (let i = 0; i < p.length; i += 4) {
    const l = (p[i] * 77 + p[i + 1] * 150 + p[i + 2] * 29) >> 8, v = Math.pow(clamp((l - lo) / span, 0, 1), 1.15) * 255;
    p[i] = p[i + 1] = p[i + 2] = v;
  }
  x.putImageData(d, 0, 0);
  return src;
}
async function addImages(list) {
  const fs = [...list].filter(f => f.type && f.type.startsWith('image/'));
  if (!fs.length) { UI.toast('NO IMAGES RECOGNIZED'); return; }
  let n = 0;
  for (const f of fs) {
    try {
      const c = await blobToCanvas(f, 960);
      const id = Date.now() + '-' + Math.random().toString(36).slice(2);
      c.toBlob(b => { if (b) IDB.put('images', { id, blob: b }); }, 'image/jpeg', 0.86);
      IMGS.push(processImage(c)); n++;
    } catch (e) { UI.toast('UNREADABLE IMAGE: ' + f.name); }
  }

  if (n) { UI.toast('+' + n + ' IMAGE' + (n > 1 ? 'S' : '')); goScene(SCENES.indexOf(SceneImages)); }
}

$('#btnMenu').addEventListener('click', () => setDrawer($('#panel').hidden));
$('#btnClose').addEventListener('click', () => setDrawer(false));
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => setTab(t.dataset.tab)));
$('#btnAddAudio').addEventListener('click', () => $('#fileAudio').click());
$('#btnAddFolder').addEventListener('click', () => $('#fileFolder').click());
$('#btnAddImg').addEventListener('click', () => $('#fileImg').click());
let clearArmed = false;
$('#btnClearAudio').addEventListener('click', () => {
  if (!Radio.files.length) return;
  if (!clearArmed) { clearArmed = true; $('#btnClearAudio').textContent = 'CONFIRM?'; setTimeout(() => { clearArmed = false; $('#btnClearAudio').textContent = 'REMOVE ALL'; }, 4000); return; }
  clearArmed = false; $('#btnClearAudio').textContent = 'REMOVE ALL';
  Radio.files = []; Radio.fileQueue = []; Radio.dropPrep(); IDB.clear('tracks');
  updateCounts(); UI.renderStations(); UI.renderLibrary();
  if (Radio.station === 'local') Radio.setStation('retro');
});
$('#btnClearImg').addEventListener('click', () => { IMGS.length = 0; IDB.clear('images'); updateCounts(); UI.renderScenes(); });
$('#fileAudio').addEventListener('change', e => { addAudioFiles(e.target.files); e.target.value = ''; });
$('#fileFolder').addEventListener('change', e => { addAudioFiles(e.target.files); e.target.value = ''; });
$('#fileImg').addEventListener('change', e => { addImages(e.target.files); e.target.value = ''; });
$('#blocks').addEventListener('click', () => { if (Radio.onAir() && Radio.onAir().kind === 'gen') UI.toast('LIVE RADIO'); });

window.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const tag = (e.target && e.target.tagName) || '';
  const k = e.key;
  if ((k === ' ' || k === 'Enter') && (tag === 'BUTTON' || tag === 'INPUT' || tag === 'SUMMARY' || tag === 'A')) return;
  if (k === 'Escape') { if (!$('#panel').hidden) setDrawer(false); return; }
  switch (k.toLowerCase()) {
    case ' ': e.preventDefault(); $('#start').hidden = true; Radio.toggle(); break;
    case 'n': case 'arrowright': $('#start').hidden = true; Radio.next(); break;
    case 'arrowleft': Radio.prev(); break;
    case 'l': toggleLike(); break;
    case 'v': nextScene(); break;
    case 'p': nextTheme(false); break;
    case 'f': toggleFull(); break;
    case 'm': setDrawer($('#panel').hidden); break;
    case 'arrowup': e.preventDefault(); setVol(settings.vol + 1 / VOLSTEPS); break;
    case 'arrowdown': e.preventDefault(); setVol(settings.vol - 1 / VOLSTEPS); break;
    default:
      if (/^[1-8]$/.test(k)) UI.pickStation(STATIONS[+k - 1].id);
  }
});

window.addEventListener('dragover', e => { e.preventDefault(); });
window.addEventListener('drop', e => {
  e.preventDefault();
  const fs = e.dataTransfer && e.dataTransfer.files ? [...e.dataTransfer.files] : [];
  const imgs = fs.filter(f => f.type && f.type.startsWith('image/'));
  const auds = fs.filter(f => (f.type && f.type.startsWith('audio/')) || AUDIO_EXT.test(f.name));
  if (imgs.length) addImages(imgs);
  if (auds.length) addAudioFiles(auds);
  if (!imgs.length && !auds.length) UI.toast('DROP WAVS OR IMAGES');
});
window.addEventListener('resize', () => resize());

/* démarrage */
Radio.station = STATIONS.some(s => s.id === settings.station && s.id !== 'local') ? settings.station : 'retro';
if (typeof settings.xfade !== 'number') settings.xfade = 4;
resize();
setTheme(settings.theme, true);
UI.renderStations(); UI.renderScenes(); UI.renderVol();
setThemeCycle(settings.themeCycle); setCycle(settings.cycle); setSleep(0); setXfade(settings.xfade);
setPx(settings.px); setReact(settings.react); setWeather(settings.weather);
UI.renderRefs(); UI.renderLibrary(); UI.renderFavs(); UI.renderHistory(); updateCounts(); UI.syncPlay();
IDB.open().then(async () => {
  const tracks = await IDB.all('tracks');
  for (const t of tracks) if (t && t.blob && !Radio.files.some(x => x.id === t.id)) { if (t.artist === 'Ma collection') t.artist = 'My library'; Radio.files.push(t); }
  if (Radio.files.length && settings.station === 'local' && !Radio.ctx) Radio.station = 'local';
  updateCounts(); UI.renderStations(); UI.renderLibrary();
  const recs = await IDB.all('images');
  for (const r of recs) { try { IMGS.push(processImage(await blobToCanvas(r.blob, 960))); } catch (e) { /* image corrompue ignorée */ } }
  updateCounts();
});
requestAnimationFrame(t => { lastFrame = t; requestAnimationFrame(frame); });

window.__slipstream = { makeTrack, makeKit, GenPlayer, STYLES, SCENES, THEMES, Radio, goScene, setTheme, settings, F, ENV };
})();
</script>

</body>
</html>
